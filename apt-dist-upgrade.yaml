- hosts: "*"
  vars:
    ansible_python_interpreter: /usr/bin/python3
  become: false
  become_user: root
  tasks:
    - name: Update apt cache and perform dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
    - name: Check if reboot required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file